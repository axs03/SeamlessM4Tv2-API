services:
  seamless-api:
    build: .
    image: seamless-api:cpu
    container_name: seamless-api
    ports:
      - "8080:8080"
    environment:
      DEVICE: auto
      # API_KEY: change-me        # require "Authorization: Bearer change-me"
      # MAX_UPLOAD_MB: "25"
      # MAX_AUDIO_SECONDS: "120"
    volumes:
      - models:/models          # model weights cache (~10 GB), survives rebuilds
    restart: unless-stopped

volumes:
  models:
