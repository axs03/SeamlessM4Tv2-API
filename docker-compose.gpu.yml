# NVIDIA GPU override. Needs the NVIDIA Container Toolkit on the host.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  seamless-api:
    build:
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu126
        TORCH_VERSION: "2.14.1"
    image: seamless-api:cuda
    environment:
      DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
